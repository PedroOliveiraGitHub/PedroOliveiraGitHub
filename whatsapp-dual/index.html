<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <title>WhatsApp Dual</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #111b21;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .header-row {
      display: flex;
      height: 55px;
      width: 100%;
    }
    .pane-header {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.3px;
      color: #ffffff;
      border-bottom: 3px solid rgba(0, 0, 0, 0.25);
    }
    .pane-personal {
      background: #128C7E;
    }
    .pane-business {
      background: #315C82;
    }
    .badge {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.22);
      font-size: 15px;
      flex-shrink: 0;
    }
    .badge.badge-logo {
      background: #ffffff;
      padding: 4px;
    }
    .badge.badge-logo svg {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div class="header-row">
    <div class="pane-header pane-personal">
      <span class="badge">👤</span>
      <span>Pessoal</span>
    </div>
    <div class="pane-header pane-business">
      <span class="badge badge-logo">
        <svg viewBox="0 0 100 60" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="epGradient" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#3E6DA0" />
              <stop offset="100%" stop-color="#A9CDE8" />
            </linearGradient>
          </defs>
          <path d="M14,48 A19,19 0 0 1 52,48" fill="none" stroke="url(#epGradient)" stroke-width="11" stroke-linecap="round" />
          <path d="M48,48 A19,19 0 0 1 86,48" fill="none" stroke="url(#epGradient)" stroke-width="11" stroke-linecap="round" />
        </svg>
      </span>
      <span>Espaço do Pé</span>
    </div>
  </div>
</body>
</html>
